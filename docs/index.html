<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>secondbarnone</title>
<meta name="description" content="A narrative balance game. Split your days between a spiritual community and a bar, and keep both your sanity and your wallet alive.">
<meta name="theme-color" content="#0a0a12">

<meta property="og:title" content="secondbarnone">
<meta property="og:description" content="Split your days between a spiritual community and a bar. Keep both your sanity and your wallet alive.">
<meta property="og:type" content="website">

<link rel="icon" href="assets/portraits/leon.webp">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <header id="hud">
    <div class="hud-top">
      <span class="hud-title">secondbarnone</span>
      <span>
        <span class="hud-date" id="hud-date">Thursday, January 1, 2026</span>
        <span class="hud-day" id="hud-day">Journey Day 1</span>
      </span>
    </div>

    <div class="stat-row">
      <span class="stat-label" id="sanity-label">🧘 Sanity</span>
      <span class="bar-track"><span class="bar-fill sanity" id="sanity-bar"></span></span>
      <span class="stat-num" id="sanity-num">50 / 100</span>
      <span class="delta" id="sanity-delta" aria-hidden="true"></span>
    </div>

    <div class="stat-row">
      <span class="stat-label" id="money-label">💰 Money</span>
      <span class="bar-track"><span class="bar-fill money" id="money-bar"></span></span>
      <span class="stat-num" id="money-num">50 / 100</span>
      <span class="delta" id="money-delta" aria-hidden="true"></span>
    </div>
  </header>

  <main id="content"></main>

  <footer>
    secondbarnone — a small narrative balance game.
    <noscript><strong>This game needs JavaScript enabled.</strong></noscript>
  </footer>

</div>

<div id="fade"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
