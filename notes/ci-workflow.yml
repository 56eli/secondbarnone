# CI workflow for secondbarnone — NOT YET ACTIVE.
#
# This file could not be committed to .github/workflows/ by the agent that
# wrote it: the GitHub App token used for that push lacks the `workflows`
# permission, so the push was rejected outright.
#
# TO ENABLE (one manual step, ~10 seconds):
#
#   mkdir -p .github/workflows
#   git mv notes/ci-workflow.yml .github/workflows/check.yml
#   git commit -m "Enable CI" && git push
#
# ...pushed by a human account, or by a token that has `workflows` scope.
#
# Everything it runs already passes locally:
#   npm ci && npm test && node scripts/check-assets.js && npm run coverage:check
#
name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` needs the lockfile, which is committed for exactly this reason.
      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      # Asset integrity: every referenced portrait and background exists, and
      # the deployed payload stays inside its budget. ImageMagick is not needed
      # here — this only reads file sizes.
      - name: Asset check
        run: node scripts/check-assets.js

      - name: Coverage gate
        run: npm run coverage:check

  # Balance is reported separately so a regression in the economy is legible
  # in the Actions summary rather than buried in the test log. The assertions
  # themselves live in tests/balance.test.js and already ran above.
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Balance simulation
        run: |
          {
            echo '### Balance simulation'
            echo '```'
            node scripts/simulate.js --runs=100 --days=200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
